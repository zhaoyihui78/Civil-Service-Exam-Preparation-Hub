name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Workbench/package-lock.json
      - name: Install dependencies
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --registry=https://registry.npmjs.org
      - name: Build public read-only site
        env:
          PAGES_ACCESS_KEY: ${{ secrets.PAGES_ACCESS_KEY }}
          VITE_BASE_PATH: /Civil-Service-Exam-Preparation-Hub/
          VITE_REQUIRE_ACCESS_KEY: "true"
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Workbench/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
